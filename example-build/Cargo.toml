[package]
name = "example-build"
version = "0.0.1"
authors = ["Adam H. Leventhal <ahl@oxidecomputer.com>"]
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
http = "1.3.1"
progenitor-middleware-client = { path = "../progenitor-middleware-client" }
reqwest = { version = "0.12.4", features = ["json", "stream"] }
reqwest-middleware = { version = "0.3.0", default-features = false, features = ["json"] }
base64 = "0.22"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[build-dependencies]
prettyplease = "0.2.36"
progenitor = { path = "../progenitor", default-features = false }
serde_json = "1.0"
syn = "2.0"
